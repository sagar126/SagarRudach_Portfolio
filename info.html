<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Info | Sagar Rudach</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="info-body">

    <!-- Shared header (edit it in js/header.js) -->
    <script src="js/header.js"></script>

    <!-- =========================================
         INFO / ABOUT
         The roles sit around the portrait in the direction
         their data-gaze names; js/info.js makes the eyes
         follow the cursor and look at a role on hover.
    ========================================= -->

    <main class="about">

        <!-- INTRO -->
        <div class="about-intro">
            <span>Hi! I'm a&hellip;</span>
        </div>

        <!-- ROLES + PORTRAIT -->
        <div class="about-stage">

            <span class="role role-ul" data-gaze="upper-left">Creator<i>*</i></span>
            <span class="role role-up" data-gaze="up">Animator<i>*</i></span>
            <span class="role role-ur" data-gaze="upper-right">Filmmaker<i>*</i></span>
            <span class="role role-l"  data-gaze="left">3D Artist<i>*</i></span>
            <span class="role role-r"  data-gaze="right">Editor<i>*</i></span>

            <!-- PORTRAIT
                 Photo mode: add assets/images/info/portrait.jpg plus
                 eye images in assets/images/info/eyes/ (center.png,
                 up.png, down.png, left.png, right.png, upper-left.png,
                 upper-right.png, lower-left.png, lower-right.png) and
                 the page switches to them automatically.
                 Until then the drawn eyes below are used. -->
            <figure class="portrait" id="portrait">

                <!-- Photo mode -->
                <img class="portrait-base" id="portraitBase" alt="Portrait of Sagar Rudach">

                <div class="eye-container">
                    <img id="eyesA" class="eyes eyes-visible" alt="">
                    <img id="eyesB" class="eyes" alt="">
                </div>

                <!-- Drawn mode (fallback) -->
                <div class="drawn-face" aria-hidden="true">
                    <div class="drawn-eye"><span class="pupil"></span></div>
                    <div class="drawn-eye"><span class="pupil"></span></div>
                </div>

            </figure>

        </div>

        <!-- BIO -->
        <div class="about-bio">
            <p>
                A filmmaker, creative producer and visual storyteller,
                creating narratives that captivate audiences and leave
                a lasting impact.
            </p>
            <a class="about-link" href="https://www.instagram.com/aree_sagar/" target="_blank" rel="noopener">
                Instagram &nearr;
            </a>
        </div>

        <!-- LOCATION -->
        <div class="about-location">
            <span>Living and working</span>
            <span>in India</span>
        </div>

    </main>

    <script src="js/main.js"></script>
    <script src="js/info.js"></script>

</body>

</html>
