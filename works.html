    <!-- Works page carousel
         The centre card is sized to its image's original ratio.
         Cards behind it use their data-shape ratio and are styled
         black & white with a glass pane (see css/style.css). -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {

        const stage       = document.querySelector(".social-stage");
        const socialCards = Array.from(document.querySelectorAll(".social-card"));
        const socialDots  = document.querySelectorAll(".social-dots button");

        if (!stage || !socialCards.length) return;

        let currentSocial = Math.floor(socialCards.length / 2);
        let ready = false;

        // Back-card tilt / scale for 1 and 2 steps away from the centre
        const STEPS = [
            { scale: .86, rotate: 6,  opacity: 1  },
            { scale: .74, rotate: 11, opacity: .8 }
        ];

        // How much of each back card is tucked behind the card in front
        const TUCK = .38;

        function parseRatio(value) {
            const [w, h] = String(value || "4/5").split("/").map(Number);
            return w && h ? w / h : .8;
        }

        socialCards.forEach(card => {

            const img = card.querySelector("img");

            card.shapeRatio = parseRatio(card.dataset.shape);
            card.imageRatio = card.shapeRatio;

            function readRatio() {
                if (img.naturalWidth && img.naturalHeight) {
                    card.imageRatio = img.naturalWidth / img.naturalHeight;
                    if (ready) updateSocialCarousel();
                }
            }

            if (img.complete) readRatio();
            else img.addEventListener("load", readRatio);
        });


        /* SIZE OF EACH CARD */
        function cardSize(card, isActive) {

            const stageW = stage.clientWidth;
            const stageH = stage.clientHeight;

            if (isActive) {
                // Fit the original image ratio inside the hero box
                const maxW = Math.min(680, stageW * (stageW < 700 ? .8 : .55));
                const maxH = stageH - 60;
                const ratio = card.imageRatio;
                const h = Math.min(maxH, maxW / ratio);
                return { w: h * ratio, h };
            }

            const h = stageH * .62;
            return { w: h * card.shapeRatio, h };
        }


        /* UPDATE CAROUSEL
           The carousel loops: every card gets a position relative to
           the centre (-2 .. 2), wrapping around the ends. */
        let lastShift = 0;

        function positionOf(index) {
            const n = socialCards.length;
            const half = Math.floor(n / 2);
            return ((index - currentSocial) % n + n + half) % n - half;
        }

        function updateSocialCarousel() {

            const active = socialCards[currentSocial];
            const activeSize = cardSize(active, true);
            const targets = new Map();

            const byPos = new Map();
            socialCards.forEach((card, index) => byPos.set(positionOf(index), card));

            targets.set(active, {
                transform: "translateX(0) rotate(0deg) scale(1)",
                opacity: 1, z: 5, hidden: false, pos: 0
            });

            // Lay out each side outwards from the edge of the hero card
            [-1, 1].forEach(dir => {

                let edge = activeSize.w / 2;

                for (let step = 1; ; step++) {

                    const card = byPos.get(dir * step);
                    if (!card) break;

                    const look = STEPS[step - 1];
                    const size = cardSize(card, false);

                    if (!look) {
                        // Further cards wait off to the side, hidden
                        targets.set(card, {
                            transform: `translateX(${dir * (edge + size.w / 2)}px) scale(.6)`,
                            opacity: 0, z: 0, hidden: true, pos: dir * step
                        });
                        continue;
                    }

                    const visibleW = size.w * look.scale;
                    const x = edge + visibleW / 2 - visibleW * TUCK;
                    edge = x + visibleW / 2;

                    targets.set(card, {
                        transform: `translateX(${dir * x}px) rotate(${dir * look.rotate}deg) scale(${look.scale})`,
                        opacity: look.opacity, z: 5 - step, hidden: false, pos: dir * step
                    });
                }
            });

            socialCards.forEach(card => {

                const target = targets.get(card);
                const isActive = card === active;
                const size = cardSize(card, isActive);

                // A card that wraps from one end to the other jumps
                // (invisibly) to just outside its new side, then slides in.
                const wrapped = card.lastPos !== undefined &&
                    card.lastPos - lastShift !== target.pos;

                if (wrapped) {
                    const dir = Math.sign(target.pos) || 1;
                    card.style.transition = "none";
                    card.style.transform =
                        `translateX(${dir * (stage.clientWidth / 2 + size.w)}px) scale(.6)`;
                    card.style.opacity = "0";
                    card.offsetWidth; // apply the jump before re-enabling transitions
                    card.style.transition = "";
                }

                card.style.width  = size.w + "px";
                card.style.height = size.h + "px";
                card.style.transform = target.transform;
                card.style.opacity = String(target.opacity);
                card.style.zIndex = String(target.z);
                card.classList.toggle("is-active", isActive);
                card.classList.toggle("is-hidden", target.hidden);
                card.setAttribute("aria-hidden", String(!isActive));
                card.lastPos = target.pos;
            });

            lastShift = 0;

            socialDots.forEach((dot, index) => {
                dot.classList.toggle("active", index === currentSocial);
            });
        }

        function goTo(index) {
            const n = socialCards.length;
            const next = ((index % n) + n) % n;

            // Signed distance moved, the short way round the loop
            const half = Math.floor(n / 2);
            lastShift = ((next - currentSocial) % n + n + half) % n - half;

            currentSocial = next;
            updateSocialCarousel();
            scheduleAutoplay();
        }


        /* AUTOPLAY
           Advances on its own; pauses while hovered, focused,
           off-screen, or when the tab is hidden. */
        const AUTOPLAY_DELAY = 3200;
        const reduceMotion =
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        let autoplayTimer = null;
        let hovered = false;
        let focused = false;
        let onScreen = true;

        function scheduleAutoplay() {
            clearTimeout(autoplayTimer);
            if (reduceMotion || hovered || focused || !onScreen || document.hidden) return;
            autoplayTimer = setTimeout(() => goTo(currentSocial + 1), AUTOPLAY_DELAY);
        }

        stage.addEventListener("pointerenter", (e) => {
            if (e.pointerType === "mouse") { hovered = true; scheduleAutoplay(); }
        });
        stage.addEventListener("pointerleave", () => { hovered = false; scheduleAutoplay(); });
        stage.addEventListener("focusin",  () => { focused = true;  scheduleAutoplay(); });
        stage.addEventListener("focusout", () => { focused = false; scheduleAutoplay(); });
        document.addEventListener("visibilitychange", scheduleAutoplay);

        new IntersectionObserver(entries => {
            onScreen = entries[0].isIntersecting;
            scheduleAutoplay();
        }, { threshold: 0.3 }).observe(stage);


        /* PREV / NEXT BUTTONS */
        const prevButton = document.getElementById("socialPrev");
        const nextButton = document.getElementById("socialNext");

        if (prevButton) prevButton.addEventListener("click", () => goTo(currentSocial - 1));
        if (nextButton) nextButton.addEventListener("click", () => goTo(currentSocial + 1));


        /* DOT NAVIGATION */
        socialDots.forEach((dot, index) => {
            dot.addEventListener("click", () => goTo(index));
        });


        /* CLICK: back card comes forward, linked hero card opens its page */
        let dragged = false;

        socialCards.forEach((card, index) => {
            card.addEventListener("click", () => {
                if (dragged) return;
                if (index !== currentSocial) goTo(index);
                else if (card.dataset.href) window.location.href = card.dataset.href;
            });
        });


        /* SWIPE / DRAG SUPPORT */
        let startX = 0;
        let isDragging = false;

        stage.addEventListener("pointerdown", (e) => {
            startX = e.clientX;
            isDragging = true;
            dragged = false;
        });

        stage.addEventListener("pointerup", (e) => {
            if (!isDragging) return;
            isDragging = false;
            const diff = e.clientX - startX;

            if (Math.abs(diff) > 50) {
                dragged = true;
                goTo(currentSocial + (diff < 0 ? 1 : -1));
            }
        });

        stage.addEventListener("pointercancel", () => { isDragging = false; });


        /* HORIZONTAL SCROLL (trackpad / shift + wheel) */
        let wheelLocked = false;

        stage.addEventListener("wheel", (e) => {

            const dx = Math.abs(e.deltaX) > Math.abs(e.deltaY)
                ? e.deltaX
                : (e.shiftKey ? e.deltaY : 0);

            if (!dx) return;

            e.preventDefault();
            if (wheelLocked || Math.abs(dx) < 15) return;

            wheelLocked = true;
            goTo(currentSocial + (dx > 0 ? 1 : -1));
            setTimeout(() => { wheelLocked = false; }, 550);

        }, { passive: false });


        /* KEYBOARD */
        stage.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") goTo(currentSocial + 1);
            else if (e.key === "ArrowLeft") goTo(currentSocial - 1);
            else if (e.key === "Enter" && socialCards[currentSocial].dataset.href) {
                window.location.href = socialCards[currentSocial].dataset.href;
            }
        });


        window.addEventListener("resize", updateSocialCarousel);

        /* INITIAL */
        ready = true;
        updateSocialCarousel();
        scheduleAutoplay();

    });
    </script>
