<script>

const socialCards = document.querySelectorAll(".social-card");
const socialDots = document.querySelectorAll(".social-dots button");

let currentSocial = 2;


/* ---------------------------------------------------------
   UPDATE CAROUSEL
--------------------------------------------------------- */

function updateSocialCarousel() {

    socialCards.forEach((card, index) => {

        let position = index - currentSocial;

        /*
        position:

        -2 = far left
        -1 = left
         0 = center
         1 = right
         2 = far right
        */

        if (position === -2) {
            card.style.transform =
                "translateX(-520px) rotate(-12deg) scale(.82)";
            card.style.opacity = ".65";
            card.style.zIndex = "1";

        }

        else if (position === -1) {
            card.style.transform =
                "translateX(-300px) rotate(-7deg) scale(.9)";
            card.style.opacity = ".9";
            card.style.zIndex = "2";
        }

        else if (position === 0) {
            card.style.transform =
                "translateX(0) rotate(0deg) scale(1)";
            card.style.opacity = "1";
            card.style.zIndex = "5";
        }

        else if (position === 1) {
            card.style.transform =
                "translateX(300px) rotate(7deg) scale(.9)";
            card.style.opacity = ".9";
            card.style.zIndex = "2";

        }

        else if (position === 2) {
            card.style.transform =
                "translateX(520px) rotate(12deg) scale(.82)";
            card.style.opacity = ".65";
            card.style.zIndex = "1";

        }

        else {
            card.style.opacity = "0";
            card.style.zIndex = "0";

        }

    });


    socialDots.forEach((dot, index) => {

        dot.classList.toggle(
            "active",
            index === currentSocial
        );

    });

}


/* ---------------------------------------------------------
   DOT NAVIGATION
--------------------------------------------------------- */

socialDots.forEach((dot, index) => {

    dot.addEventListener("click", () => {

        currentSocial = index;

        updateSocialCarousel();

    });

});


/* initial */

updateSocialCarousel();

</script>
